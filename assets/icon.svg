<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle / Subtle Gradient Glow -->
    <linearGradient id="lark-bg-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Lark Wing Primary: Vibrant Cyan to Feishu Blue -->
    <linearGradient id="lark-wing-primary" x1="10" y1="10" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#00C0FA"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Lark Wing Secondary: Deep Oceanic Indigo to Emerald Bridge -->
    <linearGradient id="lark-wing-secondary" x1="14" y1="22" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Neural Link Arc (Dual Stream Glow) -->
    <linearGradient id="lark-link-arc" x1="8" y1="36" x2="40" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="30%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Facet Highlight (Glass origami sheen) -->
    <linearGradient id="lark-facet-sheen" x1="18" y1="8" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Node Core Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#lark-bg-grad)" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Back Link Horizon Loop (Subtle bridge arc) -->
  <path d="M 12 30 C 9 20, 20 12, 34 14" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.8" stroke-dasharray="2 3"/>

  <!-- Aerodynamic Origami Lark Wing Base -->
  <path d="M 11 34 L 20 25 L 14 18 L 33 13 L 26 26 L 37 29 L 23 37 Z" 
        fill="url(#lark-wing-secondary)" fill-opacity="0.95"/>

  <!-- Upper Sweeping Feather / Wing (Main Flight) -->
  <path d="M 14 18 L 39 9 L 27 24 L 20 25 Z" 
        fill="url(#lark-wing-primary)"/>

  <!-- Origami Specular Ridge Highlight -->
  <path d="M 14 18 L 39 9 L 25 18 Z" 
        fill="url(#lark-facet-sheen)"/>

  <!-- Neural Bridge Stream Line (Outbox zero-loss pulse) -->
  <path d="M 10 32 C 16 38, 30 38, 38 27 C 40 24, 40 18, 39 9" 
        stroke="url(#lark-link-arc)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Bi-directional Link Satellite Nodes -->
  <!-- Node A: DSH Host Terminal Anchor (Cyan) -->
  <circle cx="10" cy="32" r="2.8" fill="#00F2FE"/>
  <circle cx="10" cy="32" r="1.3" fill="#FFFFFF"/>

  <!-- Node B: Feishu Cloud Endpoint Anchor (Emerald-Teal) -->
  <circle cx="38" cy="27" r="2.4" fill="#10B981"/>
  <circle cx="38" cy="27" r="1.1" fill="#FFFFFF"/>

  <!-- Node C: Zenith Sparkle (Flight tip) -->
  <circle cx="39" cy="9" r="1.6" fill="#FFFFFF"/>
</svg>
