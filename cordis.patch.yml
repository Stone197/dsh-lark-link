# dsh-lark-link bundle patch — inserts the unified bridge plugin entry into
# the composition. One plugin, two channels: Feishu/Lark + WeChat.
# Users install via `dsh plugin add dsh-lark-link`.
- insert:
    - id: lark-link
      name: 'dsh-lark-link'
      config:
        enabled: !!js "process.env.DSH_LARK_LINK_ENABLED ?? 'true'"
        # Feishu app credentials. Prefer the one-click `/lark setup` flow
        # (QR registerApp); manual entry writes to ctx.credentials.
        appId: !!js "process.env.DSH_LARK_LINK_APP_ID ?? ''"
        # groupPolicy: open | mention | keywords | reply
        groupPolicy: !!js "process.env.DSH_LARK_LINK_GROUP_POLICY ?? 'mention'"
        # Workspace root for bridge sessions. Empty = follow the GUI's most
        # recently used workspace (auto-detected, never persisted). Set this
        # (or `DSH_LARK_WORKSPACE_ROOT`) to LOCK every Feishu/WeChat session to
        # one directory. A profile-level cordis.patch.yml entry can set it too.
        workspaceRoot: !!js "process.env.DSH_LARK_WORKSPACE_ROOT ?? ''"
        # denyList: exact command prefixes denied outright (no prompt, no card).
        denyList: []
        # GH #14 inbound request replay: set auto:false to disable the
        # boot-time automatic replay (pending requests stay in the WAL and can
        # be dispatched on demand with /lark replay). Env override:
        # DSH_LARK_AUTO_REPLAY=0.
        # replay:
        #   auto: true
        #   retentionMinutes: 30
        #   maxAttempts: 2
        #
        # ── WeChat channel (ported from dsh-wechat) ──────────────────────────
        # Disable with `wechat.enabled: false`, DSH_WECHAT_ENABLED=0/false,
        # or by removing this block (omitted = enabled with defaults).
        # Storage defaults to ~/.dsh-wechat so an existing dsh-wechat login
        # keeps working (no re-scan). The settings page can override the rest.
        wechat:
          enabled: !!js "process.env.DSH_WECHAT_ENABLED ?? 'true'"
          # storageDir: ~/.dsh-wechat
          # cwd: ''                 # default working directory for WeChat sessions
          # silent: false           # only push the final reply of each turn
          # finalOnly: false        # push one conclusion per whole task
          # mergeEnabled: true      # debounce consecutive messages into one turn
